name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER"
          
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Could not detect active Java version."
            exit 1
          fi

          MAJOR_VER=$(echo "$JAVA_VER" | awk -F. '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Detected Java major version: $MAJOR_VER"

          if [ -z "$MAJOR_VER" ] || [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected version: $MAJOR_VER"
            exit 1
          fi
          echo "Java environment verified successfully (version $MAJOR_VER >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up persistent debug keystore
        run: |
          if [ -f ./debug.keystore ] && [ -s ./debug.keystore ]; then
            echo "Using existing ./debug.keystore from workspace."
          elif [ -f ./debug.keystore.base64 ] && [ -s ./debug.keystore.base64 ]; then
            echo "Decoding ./debug.keystore from ./debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          else
            echo "Restoring persistent debug keystore from static signature..."
            cat << 'EOF' | base64 -d > ./debug.keystore
          
          EOF
          fi

          if [ ! -f ./debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "ERROR: ./debug.keystore could not be prepared or is empty."
            exit 1
          fi
          echo "Persistent debug keystore verified and ready for signing."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK file exists but is empty: $TARGET_APK"
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $TARGET_APK"; exit 1 ;;
          esac

          echo "APK successfully verified at $TARGET_APK ($(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset & metadata
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "$TEMP_ASSET_DIR"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TEMP_ASSET_DIR/app-debug.apk"

          if [ ! -f "$TEMP_ASSET_DIR/app-debug.apk" ] || [ ! -s "$TEMP_ASSET_DIR/app-debug.apk" ]; then
            echo "ERROR: Failed to prepare temporary release asset."
            exit 1
          fi

          APP_VER=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$APP_VER" ]; then
            APP_VER="6.0"
          fi

          BASE_CODE=$(grep -E 'versionCode\s*=\s*' app/build.gradle.kts | head -n 1 | grep -oE '[0-9]+' || echo "6")
          # Ensure versionCode strictly ascends with every CI build
          CALCULATED_CODE=$(( BASE_CODE > GITHUB_RUN_NUMBER ? BASE_CODE : GITHUB_RUN_NUMBER ))

          RELEASE_TAG="v${APP_VER}-build-${CALCULATED_CODE}"
          DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/app-debug.apk"

          cat << EOF > "$TEMP_ASSET_DIR/update-metadata.json"
          {
            "versionCode": ${CALCULATED_CODE},
            "versionName": "${APP_VER}",
            "downloadUrl": "${DIRECT_APK_URL}",
            "releaseNotes": "NetManager Pro v${APP_VER} (Build #${CALCULATED_CODE})"
          }
          EOF

          echo "apk_path=$TEMP_ASSET_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "meta_path=$TEMP_ASSET_DIR/update-metadata.json" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$CALCULATED_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Prepared release assets at: $TEMP_ASSET_DIR (Version: $APP_VER, Code: $CALCULATED_CODE)"

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_FILE="${{ steps.prepare_asset.outputs.apk_path }}"
          META_FILE="${{ steps.prepare_asset.outputs.meta_path }}"
          APP_VER="${{ steps.prepare_asset.outputs.app_version }}"
          VER_CODE="${{ steps.prepare_asset.outputs.version_code }}"
          RELEASE_TAG="${{ steps.prepare_asset.outputs.release_tag }}"

          if [ ! -f "$ASSET_FILE" ] || [ ! -s "$ASSET_FILE" ]; then
            echo "ERROR: Asset file not found or empty at $ASSET_FILE"
            exit 1
          fi

          RELEASE_TITLE="NetManager Pro v${APP_VER} (Build #${VER_CODE})"

          NOTES=$(cat <<EOF
          ## NetManager Pro v${APP_VER}
          - VersionCode: ${VER_CODE}
          - VersionName: ${APP_VER}
          - In-App upgrade compatible with persistent signing key
          - Huawei HG630 V2 real integration & auto-discovery supported
          - Source commit SHA: ${GITHUB_SHA}
          EOF
          )

          gh release create "$RELEASE_TAG" \
            "$ASSET_FILE" \
            "$META_FILE" \
            --target "${GITHUB_SHA}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Summary ==="
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            gh release view "$RELEASE_TAG" || true

            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "APK Filename: app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"
            echo "The Actions artifact app-debug-apk remains available as a backup."

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "[$DIRECT_URL]($DIRECT_URL)"
              echo ""
              echo "The Actions artifact **app-debug-apk** remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was not completed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully."
              echo "The Actions artifact app-debug-apk remains available."
            fi
            {
              echo "## APK Build Report"
              echo ""
              echo "⚠️ Release publishing failed."
              echo "The Actions artifact **app-debug-apk** remains available in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
