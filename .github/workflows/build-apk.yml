name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER"
          
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Could not detect active Java version."
            exit 1
          fi

          MAJOR_VER=$(echo "$JAVA_VER" | awk -F. '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Detected Java major version: $MAJOR_VER"

          if [ -z "$MAJOR_VER" ] || [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected version: $MAJOR_VER"
            exit 1
          fi
          echo "Java environment verified successfully (version $MAJOR_VER >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up persistent debug keystore
        run: |
          if [ -f ./debug.keystore ] && [ -s ./debug.keystore ]; then
            echo "Using existing ./debug.keystore from workspace."
          elif [ -f ./debug.keystore.base64 ] && [ -s ./debug.keystore.base64 ]; then
            echo "Decoding ./debug.keystore from ./debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          else
            echo "Restoring persistent debug keystore from static signature..."
            cat << 'EOF' | base64 -d > ./debug.keystore
          
          EOF
          fi

          if [ ! -f ./debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "ERROR: ./debug.keystore could not be prepared or is empty."
            exit 1
          fi
          echo "Persistent debug keystore verified and ready for signing."

      - name: Build debug APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: "v${{ github.run_number }}"
        run: gradle :app:assembleDebug -PversionCode=${{ github.run_number }} -PversionName="v${{ github.run_number }}" --stacktrace --no-daemon

      - name: Validate APK
        run: |
          VERSION_CODE="${{ github.run_number }}"
          echo "Validating built APK for VersionCode: $VERSION_CODE..."
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            TARGET_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$TARGET_APK" ] || [ ! -f "$TARGET_APK" ] || [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: Valid APK not found in app/build/outputs/apk."
            exit 1
          fi

          echo "APK successfully verified at $TARGET_APK ($(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetManager-Pro-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare APK release asset & metadata
        id: prepare_asset
        run: |
          VERSION_CODE="${{ github.run_number }}"
          APK_NAME="NetManager-Pro-v${VERSION_CODE}.apk"
          RELEASE_TAG="NetManager-Pro-v${VERSION_CODE}"
          RELEASE_TITLE="NetManager Pro v${VERSION_CODE}"

          TEMP_ASSET_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "$TEMP_ASSET_DIR"

          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC_APK" ]; then
            SRC_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ] || [ ! -s "$SRC_APK" ]; then
            echo "ERROR: Failed to locate compiled APK."
            exit 1
          fi

          # Copy to final release filename: NetManager-Pro-v{versionCode}.apk
          cp "$SRC_APK" "$TEMP_ASSET_DIR/$APK_NAME"

          DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          LATEST_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${APK_NAME}"

          cat << EOF > "$TEMP_ASSET_DIR/update-metadata.json"
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "v${VERSION_CODE}",
            "apkFileName": "${APK_NAME}",
            "downloadUrl": "${DIRECT_APK_URL}",
            "latestDownloadUrl": "${LATEST_APK_URL}",
            "releaseTitle": "${RELEASE_TITLE}",
            "releaseNotes": "NetManager Pro v${VERSION_CODE}"
          }
          EOF

          echo "apk_path=$TEMP_ASSET_DIR/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "meta_path=$TEMP_ASSET_DIR/update-metadata.json" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=v$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $APK_NAME (Title: $RELEASE_TITLE)"

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_FILE="${{ steps.prepare_asset.outputs.apk_path }}"
          META_FILE="${{ steps.prepare_asset.outputs.meta_path }}"
          VER_CODE="${{ steps.prepare_asset.outputs.version_code }}"
          RELEASE_TAG="${{ steps.prepare_asset.outputs.release_tag }}"
          RELEASE_TITLE="${{ steps.prepare_asset.outputs.release_title }}"
          APK_NAME="${{ steps.prepare_asset.outputs.apk_name }}"

          if [ ! -f "$ASSET_FILE" ] || [ ! -s "$ASSET_FILE" ]; then
            echo "ERROR: Asset file not found or empty at $ASSET_FILE"
            exit 1
          fi

          NOTES=$(cat <<EOF
          ## ${RELEASE_TITLE}
          - **File:** \`${APK_NAME}\`
          - **Version Code:** \`${VER_CODE}\`
          - **Version Name:** \`v${VER_CODE}\`
          - **Commit SHA:** \`${GITHUB_SHA}\`
          - In-app update supported with persistent signing keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" \
            "$ASSET_FILE" \
            "$META_FILE" \
            --target "${GITHUB_SHA}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER_CODE="${{ github.run_number }}"
          APK_NAME="NetManager-Pro-v${VER_CODE}.apk"
          RELEASE_TAG="NetManager-Pro-v${VER_CODE}"
          RELEASE_TITLE="NetManager Pro v${VER_CODE}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"

          echo "=== APK Build & Release Summary ==="
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "APK Filename: $APK_NAME"
            echo "Direct Download URL: $DIRECT_URL"

            {
              echo "## 🚀 NetManager Pro Release Ready"
              echo ""
              echo "### [Download $APK_NAME]($DIRECT_URL)"
              echo ""
              echo "- **Release:** $RELEASE_TITLE"
              echo "- **Version Code:** $VER_CODE"
              echo "- **Direct Link:** \`$DIRECT_URL\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was not completed."
            {
              echo "## APK Build Report"
              echo ""
              echo "⚠️ Release publishing failed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
